<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workout Plan Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b18;
      --card: #1a1a2e;
      --card2: #20203a;
      --border: rgba(255,255,255,0.07);
      --text: #e2e2f0;
      --muted: #7878a0;
      --accent: #7c6ff7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Header */
    .page-header {
      text-align: center;
      padding: 3.5rem 1rem 2rem;
    }
    .page-header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #7c6ff7, #ff6b8b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }
    .page-header p { color: var(--muted); font-size: 1.05rem; }

    /* Form */
    .form-wrap { max-width: 820px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    .fieldset-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2.2rem;
    }
    .opt {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid transparent;
      cursor: pointer;
      aspect-ratio: 3 / 2;
      background: var(--card2);
      transition: border-color .18s, transform .14s, box-shadow .18s;
      user-select: none;
    }
    .opt:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .opt.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(124,111,247,0.35);
    }
    .opt img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .35s;
    }
    .opt:hover img { transform: scale(1.06); }
    .opt-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 55%, transparent 100%);
      display: flex; align-items: flex-end;
      padding: 0.7rem 0.75rem;
    }
    .opt-label {
      color: #fff; font-weight: 700;
      font-size: 0.88rem; line-height: 1.2;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .opt-check {
      position: absolute; top: 0.45rem; right: 0.45rem;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); color: #fff;
      font-size: 0.72rem; font-weight: 900;
      display: none; align-items: center; justify-content: center;
    }
    .opt.selected .opt-check { display: flex; }

    .gen-btn {
      width: 100%;
      padding: 1.1rem;
      background: linear-gradient(135deg, #7c6ff7, #ff6b8b);
      border: none;
      border-radius: 13px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform .14s, box-shadow .14s;
    }
    .gen-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,111,247,.4); }

    .error-banner {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      color: #f87171;
      font-size: 0.9rem;
      margin-bottom: 1.4rem;
      display: none;
    }
    .error-banner.show { display: block; }

    /* Loading */
    #loading-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 2rem; }
    #loading-screen.active { display: flex; }

    .spinner {
      width: 58px; height: 58px;
      border-radius: 50%;
      border: 4px solid rgba(124,111,247,.2);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
      margin-bottom: 1.6rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 1.15rem; color: var(--muted); }
    .dots span { animation: blink 1.4s infinite both; }
    .dots span:nth-child(2) { animation-delay: .22s; }
    .dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* Results */
    #results-screen { display: none; }
    #results-screen.active { display: block; }
    .results-wrap { max-width: 1140px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    .plan-intro { text-align: center; margin-bottom: 1.5rem; }
    .plan-title-text { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; margin-bottom: 0.5rem; }
    .plan-overview-text { color: var(--muted); max-width: 640px; margin: 0 auto; font-size: 0.95rem; }

    .result-actions { display: flex; gap: 0.8rem; justify-content: center; margin-bottom: 2.5rem; }
    .rbtn { padding: 0.65rem 1.4rem; border-radius: 9px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: transform .14s; }
    .rbtn:hover { transform: translateY(-1px); }
    .rbtn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .rbtn-primary { background: linear-gradient(135deg, #7c6ff7, #ff6b8b); color: #fff; }

    /* Day cards */
    .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.1rem; margin-bottom: 1.5rem; }

    .day-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
    .day-hd { padding: 1.2rem 1.4rem; display: flex; justify-content: space-between; align-items: flex-start; }
    .day-tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: .8; margin-bottom: 0.25rem; }
    .day-focus-label { font-size: 1.1rem; font-weight: 800; line-height: 1.3; }
    .day-meta-col { text-align: right; }
    .day-duration { font-size: 0.78rem; opacity: .75; }
    .intensity-pill { display: inline-block; margin-top: 0.3rem; padding: 0.18rem 0.7rem; border-radius: 20px; font-size: 0.68rem; font-weight: 700; letter-spacing: .5px; }

    .day-bd { padding: 1.1rem 1.4rem; flex: 1; }
    .mini-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
    .phase-box { background: var(--card2); border-radius: 9px; padding: 0.55rem 0.8rem; font-size: 0.83rem; color: var(--muted); margin-bottom: 1rem; }

    .ex-list { margin-bottom: 1rem; }
    .ex-row { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
    .ex-row:last-child { border-bottom: none; }
    .ex-name-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.28rem; }
    .ex-name { font-weight: 600; font-size: 0.92rem; }
    .yt-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: rgba(255,0,0,0.12); color: #ff4444;
      border: 1px solid rgba(255,0,0,0.25); border-radius: 6px;
      padding: 0.18rem 0.5rem; font-size: 0.7rem; font-weight: 600;
      text-decoration: none; white-space: nowrap; flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .yt-btn:hover { background: rgba(255,0,0,0.22); border-color: rgba(255,0,0,0.5); }
    .yt-btn svg { width: 13px; height: 13px; fill: #ff4444; flex-shrink: 0; }
    .ex-stats { display: flex; flex-wrap: wrap; gap: 0.8rem; font-size: 0.77rem; color: var(--muted); }
    .ex-note { font-size: 0.77rem; color: var(--muted); font-style: italic; margin-top: 0.25rem; }

    .rest-inner { text-align: center; padding: 1.8rem 1rem; color: var(--muted); }
    .rest-icon { font-size: 2.8rem; margin-bottom: 0.6rem; }
    .rest-inner p { font-size: 0.88rem; }

    .day-tip { background: rgba(124,111,247,.1); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0.55rem 0.8rem; font-size: 0.82rem; color: var(--muted); margin-top: 0.6rem; }

    .bottom-tips { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .tip-box { background: var(--card); border-radius: 14px; padding: 1.3rem; border: 1px solid var(--border); }
    .tip-box h3 { font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    .tip-box p { font-size: 0.9rem; }

    @media (max-width: 600px) {
      .days-grid { grid-template-columns: 1fr; }
      .bottom-tips { grid-template-columns: 1fr; }
      .option-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- FORM -->

</div>

<!-- LOADING -->
<div id="loading-screen">

/* ─── State ─── */

/* ─── Build selectors ─── */
function buildGrid(id, items, key) {
  const el = document.getElementById(id);
  items.forEach(d => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `
      <img src="${d.img}" alt="${d.l}" loading="lazy">
      <div class="opt-overlay">
        <div class="opt-label">${d.l}</div>
      </div>
      <div class="opt-check">✓</div>`;
    div.onclick = () => {
      el.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
      div.classList.add('selected');
      sel[key] = d.v;
    };
    el.appendChild(div);
  });
}

  return base[type] || '40–50 min';

/* ─────────────────────────────────────────
   EXERCISE SELECTION  by pref + day type
───────────────────────────────────────── */
function pick(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function yogaExercises(type, level) {
  const Y = DB.Yoga;
  const sets = level === 'Beginner' ? 1 : level === 'Intermediate' ? 2 : 3;
  let pool = [];
  if (type === 'flow')         pool = [...Y.flow, ...Y.standing];
  else if (type === 'hips')    pool = [...Y.floor.slice(0,4), ...Y.standing.slice(0,3)];
  else if (type === 'upper_flex') pool = [...Y.strength, ...Y.balance];
  else if (type === 'core_balance') pool = [...Y.core, ...Y.balance];
  else if (type === 'lower_flex') pool = [...Y.floor, ...Y.standing.slice(2)];
  else if (type === 'restore') pool = [...Y.floor.slice(3), ...Y.floor.slice(3)];
  else pool = [...Y.flow, ...Y.standing, ...Y.floor];

  return pick(pool, 6).map(e => ({
    name: e.n, sets, reps: e.reps || '60 sec hold', rest: '10 sec', notes: e.note,
  }));
}

function outdoorExercises(type, parms) {
  const O = DB.Outdoor;
  let pool = [];
  if (type === 'cardio' || type === 'long')   pool = O.run;
  else if (type === 'intervals')              pool = [...O.run.slice(2,4), ...O.cardio];
  else if (type === 'tempo')                  pool = [...O.run.slice(1,3), ...O.run.slice(4)];
  else if (type === 'cross')                  pool = [...O.strength, ...O.legs, ...O.cardio];
  else if (type === 'active')                 pool = [O.run[0], ...O.strength.slice(0,3)];
  else if (type === 'hiit_upper')             pool = [...O.strength.slice(0,5), ...O.cardio];
  else if (type === 'hiit_lower')             pool = [...O.legs, ...O.cardio];
  else if (type === 'circuit' || type === 'cardio_core') pool = [...O.strength, ...O.core, ...O.cardio];
  else if (type === 'push')                   pool = [...O.strength.slice(0,3), ...O.cardio];
  else if (type === 'pull')                   pool = [O.strength[2], ...O.strength.slice(3)];
  else if (type === 'legs')                   pool = O.legs;
  else if (type === 'full' || type.startsWith('full_body')) pool = [...O.strength, ...O.legs, ...O.cardio];
  else                                         pool = [...O.cardio, ...O.core];

  return pick(pool, 5).map(e => ({
    name: e.n, sets: parms.sets, reps: e.reps || parms.reps, rest: parms.rest, notes: e.note,
  }));
}

function standardExercises(pref, type, parms, count = 5) {
  const pool_map = {
    push:       ['push'],
    pull:       ['pull'],
    legs:       ['legs'],
    shoulders:  ['push', 'pull'],
    full:       ['full','push','pull','legs'],
    hiit_upper: ['push','pull','core','cardio'],
    hiit_lower: ['legs','core','cardio'],
    cardio:     ['cardio','core'],
    cardio_core:['cardio','core'],
    circuit:    ['push','pull','legs','cardio'],
    cross:      ['full','core','cardio'],
    active:     ['core','cardio'],
    accessory:  ['core','pull'],
    full_body_a:['push','legs','core'],
    full_body_b:['pull','legs','core'],
    full_body_c:['push','pull','legs'],
    intervals:  ['cardio'],
    tempo:      ['cardio'],
    long:       ['cardio'],
    flow:       ['core','push'],
    hips:       ['legs','core'],
    upper_flex: ['push','pull'],
    core_balance:['core'],
    lower_flex: ['legs'],
    restore:    ['core'],
  };

  const groups = pool_map[type] || ['full'];
  const P = DB[pref] || DB.Gym;

  let pool = [];
  groups.forEach(g => { if (P[g]) pool.push(...P[g]); });
  if (!pool.length) pool = P.full || P.push || [];

  return pick(pool, count).map(e => ({
    name: e.n, sets: parms.sets, reps: e.reps || parms.reps, rest: parms.rest, notes: e.note,
  }));
}

function getExercises(pref, type, goal, level) {
  const parms = PARAMS[goal]?.[level] || {sets:3, reps:'10–12', rest:'60 sec'};
  if (pref === 'Yoga')    return yogaExercises(type, level);
  if (pref === 'Outdoor') return outdoorExercises(type, parms);
  return standardExercises(pref, type, parms);
}

function getWarmup(type) {
  if (['push','shoulders'].includes(type)) return WARMUPS.push;
  if (type === 'pull') return WARMUPS.pull;
  if (type === 'legs') return WARMUPS.legs;
  if (['cardio','intervals','tempo','long'].includes(type)) return WARMUPS.cardio;
  if (['flow','hips','upper_flex','core_balance','lower_flex','restore'].includes(type)) return WARMUPS.yoga;
  if (type === 'circuit' || type.startsWith('hiit')) return WARMUPS.circuit;
  if (type.includes('full')) return WARMUPS.default;
  return WARMUPS.default;
}

function getCooldown(type) {
  if (['push','shoulders'].includes(type)) return COOLDOWNS.push;
  if (type === 'pull') return COOLDOWNS.pull;
  if (type === 'legs') return COOLDOWNS.legs;
  if (['cardio','intervals','tempo','long','cardio_core'].includes(type)) return COOLDOWNS.cardio;
  if (['flow','hips','upper_flex','core_balance','lower_flex','restore'].includes(type)) return COOLDOWNS.yoga;
  return COOLDOWNS.default;
}

  'Weight Loss':     (p,l) => `A ${l.toLowerCase()}-level fat-loss plan using ${p.toLowerCase()}-style training. The week alternates high-intensity sessions with steady cardio to maximise calorie burn while preserving muscle. Active recovery days keep you moving without overtaxing your system.`,
  'Muscle Building': (p,l) => `A ${l.toLowerCase()}-level hypertrophy plan built around ${p.toLowerCase()} training. Each session targets a specific muscle group with enough volume to stimulate growth, while two rest days give your body the recovery it needs to build muscle effectively.`,
  'Endurance':       (p,l) => `A ${l.toLowerCase()}-level endurance plan using ${p.toLowerCase()} training. The week balances easy aerobic sessions, intervals, tempo work, and a long session to systematically build your cardiovascular engine and stamina.`,
  'Flexibility':     (p,l) => `A ${l.toLowerCase()}-level flexibility plan using ${p.toLowerCase()} techniques. Each day targets different areas of the body with targeted holds and flows, building genuine mobility and body awareness over the week.`,
  'Strength':        (p,l) => `A ${l.toLowerCase()}-level strength programme centred on ${p.toLowerCase()} training. Heavy compound lifts are performed with ample rest to drive maximal strength adaptations, while accessory work addresses weak links and reduces injury risk.`,
  'General Fitness': (p,l) => `A ${l.toLowerCase()}-level balanced fitness plan using ${p.toLowerCase()} training. Full-body sessions three times a week build functional strength and fitness, while cardio and active recovery sessions round out your overall health.`,
};

/* ─────────────────────────────────────────
   PLAN BUILDER
───────────────────────────────────────── */
function buildPlan(pref, goal, level) {
  const split = SPLITS[goal];
  const title = TITLES[goal]?.[pref] || 'Your Custom 7-Day Plan';
  const overview = OVERVIEWS[goal]?.(pref, level) || '';

  const days = split.map((d, i) => {
    if (d.is_rest) return {
      day_number: i + 1, day_name: DAYS[i],
      workout_type: 'Rest Day', is_rest_day: true,
      duration: null, intensity: null,
      warm_up: null, exercises: [], cool_down: null, tips: null,
    };

    const exercises = getExercises(pref, d.type, goal, level);
    return {
      day_number: i + 1,
      day_name: DAYS[i],
      workout_type: d.label,
      is_rest_day: false,
      duration: getDuration(d.type, level),
      intensity: d.intensity,
      warm_up: getWarmup(d.type),
      exercises,
      cool_down: getCooldown(d.type),
      tips: TIPS[d.type] || '',
    };
  });

  return {
    plan_title: title,
    overview,
    days,
    nutrition_tip: NUTRITION[goal],
    recovery_advice: RECOVERY[goal],
  };
}

/* ─────────────────────────────────────────
   RENDER
───────────────────────────────────────── */
function renderPlan(plan) {
  const IC = {
    'Low':      {bg:'#27ae6022',c:'#2ecc71'},
    'Moderate': {bg:'#f39c1222',c:'#f39c12'},
    'High':     {bg:'#e74c3c22',c:'#e74c3c'},
    'Very High':{bg:'#c0392b22',c:'#ff6b6b'},
  };

  let html = `
    <div class="plan-intro">
      <div class="plan-title-text">${h(plan.plan_title)}</div>
      <p class="plan-overview-text">${h(plan.overview)}</p>
    </div>
    <div class="days-grid">
  `;

  plan.days.forEach((day, i) => {
    const grad = DAY_COLORS[i % DAY_COLORS.length];
    if (day.is_rest_day) {
      html += `
        <div class="day-card">
          <div class="day-hd" style="background:${grad}">
            <div>
              <div class="day-tag">${h(day.day_name)}</div>
              <div class="day-focus-label">Rest & Recover 😴</div>
            </div>
          </div>
          <div class="day-bd">
            <div class="rest-inner">
              <div class="rest-icon">🛌</div>
              <p>Allow your muscles to repair and grow. Light walking, stretching, or a gentle walk is perfectly fine.</p>
            </div>
          </div>
        </div>`;
      return;
    }

    const ic = IC[day.intensity] || {bg:'#88888822',c:'#888'};
    const ytIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8zM9.7 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>`;

    const exHtml = day.exercises.map(ex => {
      const query = encodeURIComponent(ex.name + ' exercise tutorial');
      const ytUrl = `https://www.youtube.com/results?search_query=${query}`;
      return `
      <div class="ex-row">
        <div class="ex-name-row">
          <div class="ex-name">${h(ex.name)}</div>
          <a class="yt-btn" href="${ytUrl}" target="_blank" rel="noopener">${ytIcon} Watch</a>
        </div>
        <div class="ex-stats">
          ${ex.sets  ? `<span>🔁 ${ex.sets} sets</span>` : ''}
          ${ex.reps  ? `<span>✳️ ${h(ex.reps)}</span>` : ''}
          ${ex.rest  ? `<span>⏱ ${h(ex.rest)} rest</span>` : ''}
        </div>
        ${ex.notes ? `<div class="ex-note">${h(ex.notes)}</div>` : ''}
      </div>`;
    }).join('');

    html += `
      <div class="day-card">
        <div class="day-hd" style="background:${grad}">
          <div>
            <div class="day-tag">${h(day.day_name)}</div>
            <div class="day-focus-label">${h(day.workout_type)}</div>
          </div>
          <div class="day-meta-col">
            <div class="day-duration">${h(day.duration || '')}</div>
            <div class="intensity-pill" style="background:${ic.bg};color:${ic.c}">${h(day.intensity || '')}</div>
          </div>
        </div>
        <div class="day-bd">
          ${day.warm_up ? `<div class="mini-label">Warm-Up</div><div class="phase-box">🔥 ${h(day.warm_up)}</div>` : ''}
          <div class="mini-label">Exercises</div>
          <div class="ex-list">${exHtml}</div>
          ${day.cool_down ? `<div class="mini-label">Cool-Down</div><div class="phase-box">❄️ ${h(day.cool_down)}</div>` : ''}
          ${day.tips ? `<div class="day-tip">💡 ${h(day.tips)}</div>` : ''}
        </div>
      </div>`;
  });

  html += `</div>`;

  if (plan.nutrition_tip || plan.recovery_advice) {
    html += `<div class="bottom-tips">
      ${plan.nutrition_tip    ? `<div class="tip-box"><h3>🥗 Nutrition</h3><p>${h(plan.nutrition_tip)}</p></div>` : ''}
      ${plan.recovery_advice  ? `<div class="tip-box"><h3>😴 Recovery</h3><p>${h(plan.recovery_advice)}</p></div>` : ''}
    </div>`;
  }

  document.getElementById('plan-out').innerHTML = html;
}

function h(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─────────────────────────────────────────
   CONTROL FLOW
───────────────────────────────────────── */
function show(id) {
  ['form-screen','loading-screen','results-screen'].forEach(s => {
    document.getElementById(s).classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

async function generatePlan() {
  if (!sel.pref || !sel.goal || !sel.level) {
    showError('Please select one option from each category above.');
    return;
  }
  show('loading-screen');
  // Short delay for UX polish
  await new Promise(r => setTimeout(r, 900 + Math.random() * 600));
  const plan = buildPlan(sel.pref, sel.goal, sel.level);
  renderPlan(plan);
  show('results-screen');
  window.scrollTo(0, 0);
}

function goBack() { show('form-screen'); window.scrollTo(0,0); }

function regen() {
  if (sel.pref && sel.goal && sel.level) generatePlan();
}
</script>

</html>
